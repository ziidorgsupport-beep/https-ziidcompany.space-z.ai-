<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Animated code typing preview">
  <defs>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- masks used for smooth "typing" reveal per line -->
    <mask id="m1"><rect x="0" y="0" width="0" height="100%" fill="#fff">
      <animate attributeName="width" from="0" to="760" begin="0.2s" dur="1.2s" fill="freeze" />
    </rect></mask>

    <mask id="m2"><rect x="0" y="0" width="0" height="100%" fill="#fff">
      <animate attributeName="width" from="0" to="760" begin="1.5s" dur="1.6s" fill="freeze" />
    </rect></mask>

    <mask id="m3"><rect x="0" y="0" width="0" height="100%" fill="#fff">
      <animate attributeName="width" from="0" to="760" begin="3.4s" dur="1.6s" fill="freeze" />
    </rect></mask>

    <style><![CDATA[
      .bg { fill: #071024; }
      .panel { rx:12; filter:url(#shadow); }
      .line { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size:20px; dominant-baseline:middle; }
      .comment { fill:#60a5fa; opacity:0.95 }
      .kw { fill:#fca5a5 }
      .str { fill:#9ae6b4 }
      .fn { fill:#93c5fd }
      .cursor { fill:#9ae6b4 }
    ]]></style>
  </defs>

  <!-- background panel -->
  <rect class="bg panel" x="20" y="12" width="860" height="196" />
  <!-- top glow -->
  <rect x="20" y="12" width="860" height="6" rx="6" fill="url(#grad)" opacity="0.95" />

  <!-- Decorative left gutter (line numbers) -->
  <g transform="translate(44,46)">
    <text class="line" x="0" y="0" fill="#203247" font-size="16">1</text>
    <text class="line" x="0" y="32" fill="#203247" font-size="16">2</text>
    <text class="line" x="0" y="64" fill="#203247" font-size="16">3</text>
  </g>

  <!-- Code area (masked reveals create typing effect) -->
  <g transform="translate(90,40)">
    <!-- line 1: comment -->
    <g mask="url(#m1)">
      <text class="line comment" x="0" y="0">// Welcome to ziidcompany.space-z.ai — experimental</text>
    </g>

    <!-- line 2: const product = "..."; -->
    <g transform="translate(0,32)" mask="url(#m2)">
      <tspan class="line kw" x="0" y="0">const </tspan>
      <tspan class="line fn" x="70" y="0">product</tspan>
      <tspan class="line" x="150" y="0"> = </tspan>
      <tspan class="line str" x="188" y="0">"https-ziidcompany.space-z.ai"</tspan>
      <tspan class="line" x="468" y="0">;</tspan>
    </g>

    <!-- line 3: console.log -->
    <g transform="translate(0,64)" mask="url(#m3)">
      <tspan class="line fn" x="0" y="0">console</tspan>
      <tspan class="line" x="82" y="0">.</tspan>
      <tspan class="line fn" x="90" y="0">log</tspan>
      <tspan class="line" x="122" y="0">(</tspan>
      <tspan class="line str" x="128" y="0">`Launching ${product}...`</tspan>
      <tspan class="line" x="362" y="0">);</tspan>
    </g>

    <!-- blinking cursor: appears after typing finishes, then blinks -->
    <rect x="388" y="52" width="10" height="20" class="cursor" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="5.2s" repeatCount="indefinite" />
    </rect>

    <!-- small subtle underline accent to give depth -->
    <rect x="0" y="110" width="760" height="2" fill="rgba(255,255,255,0.02)" />
  </g>

  <!-- caption / label -->
  <text x="36" y="212" fill="#9fb3c8" font-family="Inter, sans-serif" font-size="12">Animated preview — subtle typewriter reveal, syntax colors, and cursor.</text>
</svg>
