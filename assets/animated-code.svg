<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 160' width='800' height='160'>
  <defs>
    <linearGradient id='g' x1='0' x2='1'>
      <stop offset='0' stop-color='#60a5fa'/>
      <stop offset='1' stop-color='#a78bfa'/>
    </linearGradient>
    <style>
      .bg { fill: #0f1724; }
      .line { font: 20px/1.2 "SFMono-Regular", "Consolas", "Liberation Mono", Menlo, monospace; }
      .c1 { fill: #9ae6b4; }
      .c2 { fill: #93c5fd; }
      .c3 { fill: #fca5a5; }
      .cursor { fill: #9ae6b4; }
    </style>
  </defs>
  <rect class='bg' width='100%' height='100%' rx='8' />

  <!-- Code lines that fade in sequentially -->
  <text x='28' y='42' class='line c1' opacity='0'>
    <tspan id='l1'>// Welcome to ziidcompany.space-z.ai</tspan>
    <animate attributeName='opacity' from='0' to='1' begin='0.2s' dur='0.6s' fill='freeze' />
  </text>

  <text x='28' y='74' class='line c2' opacity='0'>
    <tspan id='l2'>const product = "https-ziidcompany.space-z.ai";</tspan>
    <animate attributeName='opacity' from='0' to='1' begin='0.9s' dur='0.6s' fill='freeze' />
  </text>

  <text x='28' y='106' class='line c3' opacity='0'>
    <tspan id='l3'>console.log(`Launching ${product}...`);</tspan>
    <animate attributeName='opacity' from='0' to='1' begin='1.6s' dur='0.6s' fill='freeze' />
  </text>

  <!-- Blinking cursor that appears after text lines -->
  <rect id='cursor' x='420' y='86' width='8' height='20' class='cursor' opacity='0'>
    <animate attributeName='opacity' values='0;1;0' dur='1s' begin='2.3s' repeatCount='indefinite' />
  </rect>

  <!-- Subtle glow line at the top -->
  <rect x='0' y='0' width='100%' height='4' fill='url(#g)' opacity='0.9' rx='2' />
</svg>
